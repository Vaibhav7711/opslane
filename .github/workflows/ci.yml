name: CI and Deploy
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/postgres-integration']
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: opslane
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: opslane_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opslane -d opslane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- server/pg-store.test.js server/pg-api.test.js
        env:
          DATABASE_URL: postgresql://opslane:test-only-password@localhost:5432/opslane_test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, postgres-integration]
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
